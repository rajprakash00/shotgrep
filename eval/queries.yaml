# Frozen eval query set for shotgrep v1 (SPEC.md).
#
# Freeze rule: once ranking work starts, these labels and the tolerance are
# frozen. A later ranking or pipeline change must not edit them; it appends a
# dated table to eval/RESULTS.md instead (docs/folder-structure.md).
#
# Each query names one moment in one corpus asset. `start_s`/`end_s` is the
# labeled moment; a result counts when its time range overlaps that range
# expanded by `tolerance_s` (SPEC.md: +/- 2s).
#
# Splits:
#   easy       - a direct description of the moment, using its likely words
#   paraphrase - the same kind of target described indirectly
#   temporal   - the target is named through its place in time
#   negation   - the target is named by what is absent from it
#
# Labels were placed against the built corpus index (transcripts and sampled
# thumbnails); every moment was verified frame by frame before the freeze.

version: 1
frozen_on: "2026-09-21"
tolerance_s: 2.0

queries:
