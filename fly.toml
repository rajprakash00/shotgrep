# Fly.io config for the shotgrep demo API.
#
# Rename `app` if the name is taken, then set the three public URLs below to
# the deployed API host, the deployed web origin, and the same API host (MCP
# transport allowlist). See docs/deploy.md for the full runbook.

app = "shotgrep-demo"
primary_region = "iad"

[env]
  SHOTGREP_API_URL = "https://shotgrep-demo.fly.dev"
  SHOTGREP_WEB_URL = "https://shotgrep-demo.vercel.app"
  SHOTGREP_MCP_ALLOWED_HOSTS = "shotgrep-demo.fly.dev"

[http_service]
  internal_port = 8080
  force_https = true
  # Scale to zero when idle: a 1 GB always-on Machine costs ~$6.70/month, and
  # this demo is idle most of the time. Suspend resumes in ~1s; a cold start
  # (for example after a deploy) takes ~20s.
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
