[project]
name = "shotgrep"
version = "0.1.0"
description = "Search video like it's text."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "av>=18.1.0",
    "ctranslate2>=4.8.2",
    "fastapi>=0.141.1",
    "faster-whisper>=1.2.1",
    "huggingface-hub>=1.32.0",
    "lancedb>=0.39.0",
    "mcp>=2.2.0",
    "numpy>=2.5.3",
    "onnxruntime>=1.30.0",
    "pillow>=12.3.0",
    "scenedetect>=0.7.1",
    "tokenizers>=0.23.2",
    "uvicorn>=0.53.0",
]

[project.scripts]
shotgrep = "pipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline", "api"]

[dependency-groups]
cuda = [
    "nvidia-cublas-cu12>=12.9.2.10",
]
dev = [
    "jsonschema>=4.26.0",
    "pytest>=8.3",
    "pyyaml>=6.0",
    "ruff>=0.9",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests", "corpus"]
