[project]
name = "shotgrep"
version = "0.1.0"
description = "Search video like it's text."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "scenedetect>=0.7.1",
]

[project.scripts]
shotgrep = "pipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests", "corpus"]
